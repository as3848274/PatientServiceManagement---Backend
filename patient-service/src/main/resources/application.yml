spring:
  Kafka:
    bootstrap-servers: localhost:9094
  application:
    name: patient-service
  profiles:
    active: dev
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8071}"

management:
  endpoint:
    info:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
#      defaultZone: http://localhost:8070/eureka/
       defaultZone: http://eureka:8070/eureka/