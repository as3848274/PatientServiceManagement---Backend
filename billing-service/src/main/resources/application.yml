server:
  port: 4001

grpc:
  server:
    port: 9001

spring:
  application:
    name: billing-service
  profiles:
    active: default
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8071}"

management:
  endpoint:
    info:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true

eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka/
