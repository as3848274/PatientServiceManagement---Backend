services:

  # ---------- Infra: Eureka Server ----------
  eureka:
    build:
      context: ./eureka
    container_name: eureka
    ports:
      - "8070:8070"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8071
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8070/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------- Infra: Config Server ----------
  config-server:
    build:
      context: ./config-server
    container_name: config-server
    ports:
      - "8071:8071"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8071/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------- Infra: Kafka (KRaft mode, Bitnami legacy image, no Zookeeper needed) ----------
  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------- Database: patient-service-db ----------
  patient-service-db:
    image: postgres:16
    container_name: patient-service-db
    environment:
      - POSTGRES_DB=db
      - POSTGRES_USER=admin_user
      - POSTGRES_PASSWORD=password
    ports:
      - "5001:5432"
    networks:
      - internal
    volumes:
      - patient-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------- patient-service ----------
  patient-service:
    build:
      context: ./patient-service
    container_name: patient-service
    ports:
      - "4000:4000"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - CONFIG_SERVER_URL=http://config-server:8071
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8070/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://patient-service-db:5432/db
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - BILLING_SERVICE_ADDRESS=billing-service
      - BILLING_SERVICE_GRPC_PORT=9001
    depends_on:
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
      patient-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # ---------- billing-service ----------
  billing-service:
    build:
      context: ./billing-service
    container_name: billing-service
    ports:
      - "4001:4001"
      - "9001:9001"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8071
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8070/eureka/
    depends_on:
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4001/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # ---------- analytics-service ----------
  analytics-service:
    build:
      context: ./analytics-service
    container_name: analytics-service
    ports:
      - "4002:4002"
    environment:
      - CONFIG_SERVER_URL=http://config-server:8071
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8070/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4002/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # ---------- Database: auth-service-db ----------
  auth-service-db:
    image: postgres:17
    container_name: auth-service-db
    environment:
      - POSTGRES_DB=db
      - POSTGRES_USER=admin_user
      - POSTGRES_PASSWORD=password
    ports:
      - "5002:5432"
    networks:
      - internal
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ---------- auth-service ----------
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth-service-db:5432/db
    depends_on:
      auth-service-db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/4005' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # ---------- gateway-service ----------
  gateway-service:
    build:
      context: ./gateway-service
    container_name: gateway-service
    ports:
      - "4004:4004"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:4005
    depends_on:
      patient-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  patient-db-data:
  auth-db-data: